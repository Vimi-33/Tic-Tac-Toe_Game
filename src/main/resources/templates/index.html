<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <title>Tic Tac Toe</title>

</head>
<body>

<div class="container">
    <div class="header">
        <h1>Tic-Tac-Toe</h1>
        <div class="status">
            <span th:if="${game.gameOver}"
                  th:text="${game.winner != null ? game.winner.unit + ' won' : 'Draw'}"></span>

            <span th:unless="${game.gameOver}">
                Turn:
                <span class="turn-indicator"
                      th:text="${game.currentPlayer != null ? game.currentPlayer.unit : 'X'}"
                      th:classappend="${game.currentPlayer != null and #strings.toString(game.currentPlayer.unit) == 'X' ? 'is-x' : 'is-o'}">
                </span>
            </span>
        </div>
    </div>

    <div class="board">
        <th:block th:each="row, rowStat : ${game.board.board}">
            <th:block th:each="cell, colStat : ${row}">
                <form th:action="@{/move}" method="post" class="cell-form">
                    <input type="hidden" name="x" th:value="${rowStat.index}" />
                    <input type="hidden" name="y" th:value="${colStat.index}" />

                    <button type="submit"
                            class="cell-btn"
                            th:classappend="${cell != null ? (#strings.toString(cell.unit) == 'X' ? 'x-val' : 'o-val') : ''}"
                            th:text="${cell != null ? cell.unit : ''}"
                            th:disabled="${cell != null or game.gameOver}">
                    </button>
                </form>
            </th:block>
        </th:block>
    </div>

    <form th:action="@{/reset}" method="post">
        <button type="submit" class="reset-btn">Reset Game</button>
    </form>
</div>

<!-- Game over overlay: only rendered when the game has ended -->
<div class="overlay" id="resultOverlay" th:if="${game.gameOver}">
    <div class="result-card"
         th:classappend="${game.winner != null ? (#strings.toString(game.winner.unit) == 'X' ? 'win-x' : 'win-o') : 'draw'}">

        <div class="result-label"
             th:text="${game.winner != null ? 'Winner' : 'Game over'}"></div>

        <div class="result-symbol"
             th:text="${game.winner != null ? game.winner.unit : '='}"></div>

        <div class="result-title"
             th:text="${game.winner != null ? game.winner.unit + ' wins!' : 'It''s a draw!'}"></div>

        <div class="result-actions">
            <form th:action="@{/reset}" method="post">
                <button type="submit" class="btn-primary">Play Again</button>
            </form>
            <button type="button" class="btn-secondary"
                    onclick="document.getElementById('resultOverlay').classList.add('hidden')">
                View Board
            </button>
        </div>
    </div>
</div>

</body>
</html>
